<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Phone Assistant monitor</title>
  <desc id="desc">A fictional example conversation shown on laptop and mobile, with live captions and a direct hangup button. This is a designed preview, not a real call transcript.</desc>
  <rect width="1000" height="920" rx="24" fill="#edf1e9"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="45" y="57" font-size="12" font-weight="700" letter-spacing="3" fill="#607970">PRIVATE MONITOR</text>
    <text x="43" y="105" font-size="34" font-weight="700" fill="#16372f">The conversation, in view.</text>
    <text x="45" y="137" font-size="16" fill="#607970">Pair your browser. Follow the captions. Stop the call directly.</text>
  </g>
  <rect x="40" y="180" width="587" height="665" rx="18" fill="#f8faf3" stroke="#ccd7c9"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="66" y="214" font-size="10" font-weight="700" letter-spacing="2" fill="#698277">PHONE ASSISTANT</text>
    <text x="64" y="249" font-size="27" font-weight="700" fill="#1c3830">Call monitor</text>
    <rect x="65" y="271" width="537" height="37" rx="8" fill="#e6eee2"/>
    <circle cx="82" cy="290" r="4" fill="#299665"/>
    <text x="96" y="295" font-size="13" fill="#385a48">Live event stream connected</text>
    <rect x="65" y="328" width="537" height="122" rx="12" fill="#fffef8" stroke="#d4ded0"/>
    <text x="83" y="354" font-size="10" font-weight="700" letter-spacing="1.5" fill="#788d7d">YOUR CALLS</text>
    <text x="83" y="381" font-size="18" font-weight="600" fill="#1c3830">Example service desk</text>
    <line x1="83" y1="394" x2="581" y2="394" stroke="#e0e5d8"/>
    <rect x="82" y="408" width="91" height="25" rx="12" fill="#d6efdb"/>
    <text x="94" y="425" font-size="11" fill="#276440">In progress</text>
    <text x="554" y="425" font-size="12" fill="#6c8374">0:42</text>
    <text x="65" y="487" font-size="18" font-weight="700" fill="#1c3830">Conversation</text>
    <text x="65" y="509" font-size="11" fill="#7a8d7f">Captions may trail speech or contain errors.</text>
    <rect x="65" y="529" width="495" height="92" rx="11" fill="#fffef8" stroke="#d4ded0"/>
    <text x="81" y="550" font-size="10" font-weight="700" letter-spacing="1" fill="#76907d">RECIPIENT</text>
    <text x="81" y="575" font-size="16" fill="#233f31">Your request is ready. Pickup is available</text>
    <text x="81" y="601" font-size="16" fill="#233f31">until five this afternoon.</text>
    <rect x="107" y="638" width="495" height="92" rx="11" fill="#e2ecdf" stroke="#d1ddcd"/>
    <text x="124" y="659" font-size="10" font-weight="700" letter-spacing="1" fill="#658772">YOUR ASSISTANT</text>
    <text x="124" y="684" font-size="16" fill="#233f31">Thank you. Is there anything Alex needs</text>
    <text x="124" y="710" font-size="16" fill="#233f31">to bring when collecting it?</text>
    <text x="143" y="766" font-size="11" fill="#77877a">Hangup sends a direct command to the service.</text>
    <rect x="65" y="780" width="537" height="44" rx="10" fill="#b9443b"/>
    <text x="286" y="808" font-size="16" font-weight="700" fill="#fff">Hang up call</text>
  </g>
  <rect x="661" y="245" width="295" height="600" rx="36" fill="#17352d"/>
  <rect x="673" y="259" width="271" height="572" rx="27" fill="#f8faf3"/>
  <rect x="756" y="265" width="102" height="17" rx="8" fill="#17352d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="691" y="319" font-size="8" font-weight="700" letter-spacing="1.5" fill="#698277">PHONE ASSISTANT</text>
    <text x="689" y="351" font-size="25" font-weight="700" fill="#1c3830">Call monitor</text>
    <rect x="688" y="371" width="241" height="31" rx="8" fill="#e6eee2"/>
    <circle cx="702" cy="387" r="4" fill="#299665"/>
    <text x="715" y="391" font-size="10" fill="#385a48">Live stream connected</text>
    <rect x="688" y="418" width="241" height="89" rx="11" fill="#fffef8" stroke="#d4ded0"/>
    <text x="701" y="444" font-size="14" font-weight="600" fill="#1c3830">Example service desk</text>
    <rect x="700" y="463" width="85" height="23" rx="11" fill="#d6efdb"/>
    <text x="710" y="479" font-size="10" fill="#276440">In progress</text>
    <text x="890" y="479" font-size="11" fill="#6c8374">0:42</text>
    <text x="688" y="541" font-size="16" font-weight="700" fill="#1c3830">Conversation</text>
    <rect x="688" y="558" width="223" height="81" rx="9" fill="#fffef8" stroke="#d4ded0"/>
    <text x="701" y="579" font-size="8" font-weight="700" letter-spacing="1" fill="#76907d">RECIPIENT</text>
    <text x="701" y="601" font-size="13" fill="#233f31">Your request is ready.</text>
    <text x="701" y="622" font-size="13" fill="#233f31">Pickup is available until five.</text>
    <rect x="705" y="654" width="223" height="81" rx="9" fill="#e2ecdf" stroke="#d1ddcd"/>
    <text x="718" y="675" font-size="8" font-weight="700" letter-spacing="1" fill="#658772">YOUR ASSISTANT</text>
    <text x="718" y="697" font-size="13" fill="#233f31">Thank you. What should Alex</text>
    <text x="718" y="718" font-size="13" fill="#233f31">bring when collecting it?</text>
    <rect x="688" y="763" width="241" height="46" rx="10" fill="#b9443b"/>
    <text x="764" y="792" font-size="14" font-weight="700" fill="#fff">Hang up call</text>
    <text x="45" y="888" font-size="12" fill="#829081">ILLUSTRATIVE PREVIEW · FICTIONAL CONVERSATION · NO PRIVATE CALL DATA</text>
  </g>
</svg>
