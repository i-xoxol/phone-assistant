services:
  phone:
    build:
      context: .
      target: ${PHONE_IMAGE_TARGET:-runtime}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/calls.sqlite3
      OAUTH_DATABASE_PATH: /data/oauth.sqlite3
      APPOINTMENT_DATABASE_PATH: /data/appointments.sqlite3
      OWNER_PROMPT_DIRECTORY: /data/owner-prompts
      RECORDING_NOTICE_DIRECTORY: /data/recording-notices
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - phone-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
volumes:
  phone-data:
