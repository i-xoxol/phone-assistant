# A LOCAL simulation, not a cloud deployment or real telephone test.
name: phone-managed-demo
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: phone
      POSTGRES_USER: phone
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U phone -d phone']
      interval: 3s
      timeout: 3s
      retries: 30
  phone:
    build:
      context: ../..
      target: managed
    command: [uvicorn, scripts.managed_demo:build_demo, --factory, --host, 0.0.0.0, --port, '8766', --workers, '1']
    ports: ['127.0.0.1:18766:8766']
    environment:
      DEPLOYMENT_MODE: managed
      DATABASE_URL: postgresql://phone:local-demo-only@postgres/phone?sslmode=disable
      PUBLIC_BASE_URL: https://localhost:18767
      LOCAL_API_TOKEN: local-demo-only
      MCP_ENABLED: 'true'
    volumes:
      - files:/data
    depends_on:
      postgres:
        condition: service_healthy
  portal:
    image: caddy:2-alpine
    ports: ['127.0.0.1:18767:18767']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - local-certificates:/data
    depends_on:
      phone:
        condition: service_healthy
volumes:
  postgres:
  files:
  local-certificates:
